name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Desktop smoke test
        run: npm run test:desktop
      - name: Build installer
        run: npm run dist
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -LiteralPath release/SHA256SUMS-windows.txt
          }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-board-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --verify-tag --generate-notes
          }
          gh release upload "$env:GITHUB_REF_NAME" release/*.exe release/SHA256SUMS-windows.txt --clobber
